spring.application.name=prime
spring.profiles.default=wildfly
joinfaces.faces-servlet.url-mappings=*.xhtml
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prime}
spring.datasource.username=${DB_USERNAME:prime}
spring.datasource.password=${DB_PASSWORD:prime_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
prime.format.locale=pl-PL
prime.format.date-pattern=dd.MM.yyyy
prime.format.currency-code=PLN
